name: Auto Update Config Date

on:
  push:
    paths:
      - 'Config/**' # 监听 Config 文件夹下的所有文件变化

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2 # 必须加上这个，以便获取上一次提交的对比

      - name: Set current date and update changed files
        run: |
          # 1. 获取当前北京时间（UTC+8）
          CURRENT_TIME=$(date -d "+8 hours" +"%Y-%m-%d %H:%M:%S")
          echo "Current time is: $CURRENT_TIME"
          
          # 2. 找出在 Config 文件夹中被修改的文件列表
          # git diff-tree 可以精准列出本次 push 修改的文件
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^Config/' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed in Config/ directory."
            exit 0
          fi

          echo "Detected changed files:"
          echo "$CHANGED_FILES"

          # 3. 循环处理每一个被修改的文件
          echo "$CHANGED_FILES" | while read -r FILE; do
            # 确保文件还存在（防止文件被删了导致报错）
            if [ -f "$FILE" ]; then
              echo "Updating date in: $FILE"
              # 使用 sed 替换文件中的日期行
              sed -i "s/# 日期：.*/# 日期：${CURRENT_TIME}/g" "$FILE"
            fi
          done

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查整个 Config 文件夹是否有日期行被改动
          if git diff --quiet Config/; then
            echo "No date adjustments needed."
          else
            git add Config/
            git commit -m "chore: auto update config date [skip ci]"
            git push
          fi
