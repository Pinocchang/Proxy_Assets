# mihomo 配置
# 日期：2026-08-16 18:30:26
# 配置作者：Pinocchang
# 适用版本：所有使用 mihomo 核心的程序

# 官方文档: https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml
# 以 ';' 或 '#' 或 '//' 开头的配置文件行为注释行
# ====================

p: &p {type: http, interval: 86400, health-check: {enable: true, url: http://1.1.1.1/generate_204, interval: 1800, timeout: 5000}}
proxy-providers:
  Subscribe: # 在此将 "http://your-service-provider" 替换为你的机场订阅
    url: 
    <<: *p
    #override: 
      #additional-prefix: "节点前缀"
      #additional-suffix: "节点后缀"

mixed-port: 7893
tcp-concurrent: true
allow-lan: true
ipv6: false
log-level: info
unified-delay: true

geodata-mode: true
geox-url:
  geoip: "https://git.repcz.link/raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat"
  geosite: "https://git.repcz.link/github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://git.repcz.link/raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb"
  asn: "https://git.repcz.link/raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb"

profile: { store-selected: true, store-fake-ip: false }
sniffer: { enable: true, sniff: { HTTP: { ports: [80], override-destination: true }, TLS: { ports: [443, 8443] }, QUIC: { ports: [443, 8443] } } }

tun:
  enable: true
  stack: mixed
  dns-hijack: [any:53]
        
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  listen: :1053
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['+.lan', '*', '+.local', '+.cmpassport.com', 'id6.me', 'open.e.189.cn', 'mdn.open.wo.cn', 'opencloud.wostore.cn', 'auth.wosms.cn', '+.10099.com.cn', '+.msftconnecttest.com', '+.msftncsi.com', 'lancache.steamcontent.com']
  nameserver: [223.5.5.5, 119.29.29.29]

# 锚点参数修改
# 修复：让服务策略组具备外挂节点组和区域组的能力，不再是死锁状态
pg: &pg {type: select, proxies: [手动切换, 0.1节点, 美国节点, 香港节点, DIRECT, All Nodes]}
pg01: &pg01 {type: select, proxies: [手动切换, 0.1节点, 0.01节点, 美国节点, DIRECT, All Nodes]}
select: &select {type: select, include-all: true}
c: &c {type: http, behavior: classical, format: text, interval: 86400}

proxy-groups:
  # 1. 主控切换组
  - {name: 手动切换, type: select, include-all: false, proxies: [0.1节点, 0.01节点, 美国节点, 香港节点, 狮城节点, All Nodes], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/SSID_1.png}
  
  # 2. 自动正则过滤出来的区域公共组
  - {name: 0.1节点, <<: *select, filter: "(0\\.1|0.10)", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Filter.png}
  - {name: 0.01节点, <<: *select, filter: "(0\\.01|0.010)", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Filter.png}
  - {name: 美国节点, <<: *select, filter: "(?i)(?!.*(0\\.1|0\\.01))(🇺🇸|美国|洛杉矶|圣何塞|(\b(US|United States)\b))", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png}
  - {name: 香港节点, <<: *select, filter: "(?i)(?!.*(0\\.1|0\\.01))(🇭🇰|香港|(\b(HK|Hong)\b))", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png}
  - {name: 狮城节点, <<: *select, filter: "(?i)(?!.*(0\\.1|0\\.01))(🇸🇬|新加坡|狮|(\b(SG|Singapore)\b))", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png}
  - {name: 日本节点, <<: *select, filter: "(?i)(?!.*(0\\.1|0\\.01))(🇯🇵|日本|东京|(\b(JP|Japan)\b))", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png}
  - {name: 台湾节点, <<: *select, filter: "(?i)(?!.*(0\\.1|0\\.01))(🇨🇳|🇹🇼|台湾|(\b(TW|Tai|Taiwan)\b))", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png}
  - {name: All Nodes, type: select, include-all: true, icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/loadbalance.png}
  
  # 3. 分流业务组（继承修复后的 pg 锚点，默认继承“手动切换”，亦可单独自选）
  - {name: 国外网站, <<: *pg, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png}
  - {name: 国际媒体, <<: *pg, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png}
  - {name: 苹果服务, <<: *select, include-all: false, proxies: [DIRECT, 手动切换, 0.01节点, 美国节点, All Nodes], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_1.png}
  - {name: AI, <<: *pg, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png}
  - {name: Github, <<: *select, include-all: false, proxies: [手动切换, DIRECT, 美国节点, All Nodes], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/GitHub.png}
  - {name: 微软服务, <<: *pg, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png}
  - {name: Telegram, <<: *pg01, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png}
  - {name: 推特消息, <<: *pg, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png}
  - {name: 游戏平台, <<: *pg, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png}
  - {name: Emby, <<: *pg01, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png}
  - {name: Spotify, <<: *pg, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png}
  - {name: YouTube Music, <<: *pg, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube_Music.png}
  - {name: 谷歌服务, <<: *pg01, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png}
  - {name: 兜底分流, <<: *select, include-all: false, proxies: [手动切换, DIRECT, 美国节点, All Nodes], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png}


