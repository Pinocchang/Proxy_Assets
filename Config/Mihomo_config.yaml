rules:
  # 自定义
  - RULE-SET,123pan,DIRECT
  - RULE-SET,Pinocahang_Direct,DIRECT
  - RULE-SET,Pinocahang_Proxy,手动切换
  
  # 最高优先级预留给 局域网 和 广告拦截
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Reject,REJECT
  - RULE-SET,Direct,DIRECT
  
  # 特殊业务分流
  - RULE-SET,AI,AI
  - RULE-SET,Github,Github
  - RULE-SET,OneDrive,微软服务
  - RULE-SET,Microsoft,微软服务
  
  # 谷歌与视频媒体分流
  - RULE-SET,YouTube_Music,YouTube Music
  - RULE-SET,YouTube,国际媒体
  - RULE-SET,Google,谷歌服务
  
  # 社交与通讯
  - RULE-SET,Twitter,推特消息
  - RULE-SET,Telegram,电报消息
  
  # 游戏与音乐
  - RULE-SET,Steam,游戏平台
  - RULE-SET,Epic,游戏平台
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Emby,Emby
  
  # 国际流媒体流向媒体组
  - RULE-SET,Bahamut,国际媒体
  - RULE-SET,Netflix,国际媒体
  - RULE-SET,Disney,国际媒体
  - RULE-SET,PrimeVideo,国际媒体
  - RULE-SET,HBO,国际媒体
  - RULE-SET,TikTok,国际媒体
  
  # 苹果服务分流修复
  - RULE-SET,AppleCN,DIRECT
  - RULE-SET,AppleProxy,苹果服务  # 修复：交由苹果服务组处理，可在组内单独挂载美国或其他节点
  
  # 通用代理与国外兜底
  - RULE-SET,Proxy,国外网站    # 修复：让基础外部通用代理集流向“国外网站”组
  - GEOIP,CN,DIRECT
  - MATCH,兜底分流
